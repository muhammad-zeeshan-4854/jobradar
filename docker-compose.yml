services:
  dashboard:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped

  watcher:
    build: .
    command: ["jobradar", "watch"]
    env_file: .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data
    restart: unless-stopped
