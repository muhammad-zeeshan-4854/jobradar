[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar"
version = "1.0.0"
description = "Scrape job boards, score matches against your skills and get alerted on Telegram, email or Discord."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.31",
  "PyYAML>=6.0",
  "python-dotenv>=1.0",
  "Flask>=3.0",
  "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]
server = ["gunicorn>=22.0"]

[project.scripts]
jobradar = "jobradar.cli:main"

[tool.setuptools.packages.find]
include = ["jobradar*"]

[tool.setuptools.package-data]
jobradar = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
